<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - AfriHub</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      text-align: center;
      color: white;
      max-width: 400px;
    }
    
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    
    h1 {
      font-size: 28px;
      margin-bottom: 12px;
      font-weight: 700;
    }
    
    p {
      font-size: 16px;
      line-height: 1.5;
      opacity: 0.9;
      margin-bottom: 24px;
    }
    
    .tips {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }
    
    .tips h2 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      opacity: 0.8;
    }
    
    .tips ul {
      text-align: left;
      list-style: none;
    }
    
    .tips li {
      font-size: 14px;
      padding: 4px 0;
      padding-left: 20px;
      position: relative;
    }
    
    .tips li:before {
      content: "✓";
      position: absolute;
      left: 0;
    }
    
    button {
      background: white;
      color: #22c55e;
      border: none;
      padding: 12px 32px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    
    button:hover {
      transform: scale(1.05);
    }
    
    button:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>Don't worry! You can still access your cached business listings and continue browsing.</p>
    
    <div class="tips">
      <h2>What you can do:</h2>
      <ul>
        <li>View cached business profiles</li>
        <li>Check saved searches</li>
        <li>Draft WhatsApp messages</li>
        <li>Review previously loaded maps</li>
      </ul>
    </div>
    
    <button onclick="window.location.reload()">
      Try Again
    </button>
  </div>

  <script>
    // Auto-retry connection every 10 seconds
    setInterval(() => {
      if (navigator.onLine) {
        window.location.reload();
      }
    }, 10000);

    // Listen for online event
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
